# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: barber-landing-page
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: barber-db
          property: connectionString
      # Optional - fill these in the Render dashboard to turn on the extras:
      - key: GOOGLE_CREDENTIALS_JSON   # paste the whole service-account JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: ADMIN_WHATSAPP_TO         # e.g. whatsapp:+60123456789
        sync: false

databases:
  - name: barber-db
    plan: free
